name: Health check

# End-to-end read-only check against the live Google Search Console API. Auth is
# the OAuth2 refresh flow (client id/secret + refresh token stored as repo
# secrets — no per-run minting by hand). smoke makes NO writes: it only lists
# the account's properties (sites.list). Runs daily + manual dispatch only
# (never on push/PR), so secrets aren't exposed to PRs/forks; the smoke step
# skips itself when the secrets are not configured.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-search-console'
    env:
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
      GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.GOOGLE_SEARCH_CONSOLE_CLIENT_ID != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.GOOGLE_SEARCH_CONSOLE_CLIENT_ID == ''
        run: echo "GOOGLE_SEARCH_CONSOLE_* secrets are not set — live smoke skipped."
